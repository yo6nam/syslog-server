name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GO_VERSION: "1.19"
  BINARY_NAME: syslog-server

permissions:
  contents: write

jobs:
  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -v -trimpath -ldflags="-s -w" -o dist/${BINARY_NAME}-linux-amd64 .

      - name: Smoke test binary
        run: |
          file dist/${BINARY_NAME}-linux-amd64
          ./dist/${BINARY_NAME}-linux-amd64 --help || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-linux-amd64
          path: dist/${{ env.BINARY_NAME }}-linux-amd64
          if-no-files-found: error
          retention-days: 30

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BINARY_NAME }}-linux-amd64
